# Update the docs using the rewrite-recipe-markdown-generator
name: Update docs

on:
  workflow_dispatch:
    inputs:
      latest-versions-only:
        type: boolean
        description: Only update the latest versions of every OpenRewrite module
        default: true
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: "update-docs"
  cancel-in-progress: true

jobs:
  build:
    name: Update docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LATEST_VERSIONS_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.latest-versions-only }}
      # OpenRewrite and Moderne artifacts resolve from the Code Genome Project repository, which requires
      # authentication; the generator's build reads these as the codegenome repository credentials.
      ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
      ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
    steps:
      # Shared setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@v6
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        with:
          go-version: '1.25'        # recipes-go and rewrite-go both require go 1.25 (their go.mod)
      - name: Build the rewrite-go-rpc server
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        run: |
          # GoExecutor.find() checks GOROOT first, so this keeps the RPC server on the toolchain
          # setup-go put on PATH. Redundant once openrewrite/rewrite#8337 is released, since that
          # makes PATH beat the runner image's older /usr/bin/go.
          echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

          # rewrite-go-rpc isn't published as a binary, so build it from source. `go install` names it
          # after its package dir (`rpc`), but the loader launches `rewrite-go-rpc` from PATH.
          go install github.com/openrewrite/rewrite/rewrite-go/cmd/rpc@latest
          ln -sf "$(go env GOPATH)/bin/rpc" "$(go env GOPATH)/bin/rewrite-go-rpc"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Run generator
      - uses: actions/checkout@v7
        with:
          repository: 'openrewrite/rewrite-recipe-markdown-generator'
          path: 'rewrite-recipe-markdown-generator'

      # Checkout docs repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: 'rewrite-docs'

      - name: Generate Markdown
        run: |
          # A full run diffs the catalog against this baseline into a changelog, and updates the copy for the
          # changelog pull request below; the baseline on master only moves on when that is merged.
          cp ../rewrite-docs/docs/changelog/recipeDescriptors.yml "$RUNNER_TEMP/"
          ./gradlew run -PlatestVersionsOnly=${{ env.LATEST_VERSIONS_ONLY }} -PrecipeDescriptors="$RUNNER_TEMP/recipeDescriptors.yml"
        working-directory: rewrite-recipe-markdown-generator

      # Configure git user
      - name: configure-git-user
        working-directory: rewrite-docs
        run: |
          git config user.email "team@moderne.io"
          git config user.name "team-moderne[bot]"

      # Conditionally replace latest versions only
      - name: Replace latest versions
        if: ${{ env.LATEST_VERSIONS_ONLY == 'true' }}
        working-directory: rewrite-docs
        run: |
          cp ../rewrite-recipe-markdown-generator/build/docs/latest-versions-of-every-openrewrite-module.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/latest-versions.js src/plugins/
          git add docs/reference/latest-versions-of-every-openrewrite-module.md src/plugins/latest-versions.js

      # Full recipe update - replace recipes and all reference files
      - name: Replace recipes and reference files
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        working-directory: rewrite-docs
        run: |
          # Replace recipes directory (contains all 5,000+ individual recipe markdown files)
          rm -rf docs/recipes/
          cp -r ../rewrite-recipe-markdown-generator/build/docs/recipes docs/recipes

          # Copy reference/list files
          cp ../rewrite-recipe-markdown-generator/build/docs/all-recipes*.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/recipes-by-tag.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/recipes-with-data-tables.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/scanning-recipes.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/standalone-recipes.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/moderne-recipes.md docs/reference/
          cp ../rewrite-recipe-markdown-generator/build/docs/latest-versions-of-every-openrewrite-module.md docs/reference/

          # Copy JS plugin file
          cp ../rewrite-recipe-markdown-generator/build/docs/latest-versions.js src/plugins/

          # Copy static HTML redirect pages for proprietary recipes -> Moderne
          # These are served at old recipe URLs and redirect to Moderne docs
          rm -rf static/recipes/
          cp -r ../rewrite-recipe-markdown-generator/build/docs/static/recipes static/recipes

          # Stage all changes
          git add docs/recipes docs/reference src/plugins/latest-versions.js static/recipes

      # Update Gradle plugin properties table from generated docs
      - name: Update Gradle plugin properties
        working-directory: rewrite-docs
        run: node scripts/update-gradle-plugin-props.mjs && git add docs/reference/gradle-plugin-configuration.md

      # Commit and push changes
      - name: Commit and push
        working-directory: rewrite-docs
        run: |
          git diff --quiet HEAD || (git commit -m "[Auto] Update docs as of $(date +'%Y-%m-%dT%H%M')" && git push origin master)

      # Every full run replaces the one pull request carrying the changelog, so it rolls forward to the newest
      # release until merged. Its pushes, made with the GITHUB_TOKEN, start no pull_request workflows, so PR
      # validation is started here instead.
      - name: Open the changelog pull request
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' && hashFiles('rewrite-recipe-markdown-generator/build/docs/*-Release.md') != '' }}
        working-directory: rewrite-docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog=$(basename ../rewrite-recipe-markdown-generator/build/docs/*-Release.md .md)
          version=$(echo "${changelog%-Release}" | tr - .)
          if [ -e "docs/changelog/$changelog.md" ]; then
            echo "::warning::The $version changelog is already published; its changes wait for the next release's changelog."
            exit 0
          fi
          if cmp -s docs/changelog/recipeDescriptors.yml "$RUNNER_TEMP/recipeDescriptors.yml"; then
            echo "::warning::The generator wrote a changelog without updating the baseline, so no pull request was opened."
            exit 0
          fi

          count() { awk '/^[^ #]/{a=$1; sub(/:$/, "", a)} /^    [^ -]/{c[a]++} END{for(k in c) print k, c[k]}' | LC_ALL=C sort; }
          fewer=$(LC_ALL=C join -a1 -a2 -e0 -o 0,1.2,2.2 \
            <(count < docs/changelog/recipeDescriptors.yml) \
            <(count < "$RUNNER_TEMP/recipeDescriptors.yml") |
            awk '$3 < $2 { printf "- `%s`: %d → %d\n", $1, $2, $3 }')

          git switch -C auto/changelog
          cp "../rewrite-recipe-markdown-generator/build/docs/$changelog.md" docs/changelog/
          cp "$RUNNER_TEMP/recipeDescriptors.yml" docs/changelog/
          sed -i "0,/^\( *\)'changelog\/.*/s//\1'changelog\/$changelog',\n&/" sidebars.ts
          git add docs/changelog sidebars.ts
          git commit -m "Add the $version changelog"
          git push --force origin auto/changelog

          body="$RUNNER_TEMP/changelog-pr.md"
          {
            echo "Publishes the changelog of everything that changed since the last one, as found by [this full docs run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo 'Every full run replaces this branch, so the changelog rolls forward to the newest release until this is merged. Merging it also moves `docs/changelog/recipeDescriptors.yml` on, so the next changelog starts where this one ends.'
            if [ -n "$fewer" ]; then
              echo
              echo 'These modules have fewer recipes than in the last changelog. A recipe or two is a removal; a module down to zero, or most of the way, usually means its language failed to load in this run, so start the run again rather than merge:'
              echo
              echo "$fewer"
            fi
          } > "$body"
          pr=$(gh pr list --head auto/changelog --state open --json number --jq '.[].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Add the $version changelog" --body-file "$body"
          else
            gh pr create --base master --head auto/changelog --title "Add the $version changelog" --body-file "$body"
          fi
          gh workflow run pr-validation.yml --ref auto/changelog
