# Keep the Gradle plugin properties table in sync with the rewrite-gradle-plugin reference
name: Update Gradle plugin properties

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: "update-gradle-plugin-props"
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update Gradle plugin properties
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update the properties table
        run: node scripts/update-gradle-plugin-props.mjs

      # A push made with the GITHUB_TOKEN doesn't trigger the push-to-master deploy, so dispatch it explicitly.
      - name: Commit, push and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          git config user.email "team@moderne.io"
          git config user.name "team-moderne[bot]"
          git commit -am "[Auto] Update Gradle plugin properties as of $(date +'%Y-%m-%dT%H%M')"
          git push origin master
          gh workflow run pages.yml --ref master
