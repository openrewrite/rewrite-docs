name: PR validation

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-validation-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The checkout is the PR merge commit, so its first parent is the base branch.
      - name: Check file types
        run: node scripts/check-file-types.js
        env:
          BASE_REF: HEAD^1

      - name: TypeScript type check
        run: yarn typecheck

      - name: Check for orphaned pages
        run: node scripts/check-orphaned-pages.js

      - name: Build site
        run: yarn build
        env:
          CI_STRICT_LINKS: "1"
          DOCUSAURUS_IGNORE_SSG_WARNINGS: true

  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Test the docs tasks
        run: ./gradlew -p buildSrc test
